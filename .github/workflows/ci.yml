name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # every Monday 06:00 UTC — re-run fetch to catch new certs
    - cron: '0 6 * * 1'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: syntax check
        run: python -m py_compile src/fetch_ct.py
      - name: unit test templates/parsing (no network)
        run: |
          python - <<'PY'
import ast, pathlib
src = pathlib.Path('src/fetch_ct.py').read_text()
# must define PANEL and get()
assert 'PANEL' in src and 'def get(' in src
print('fetch_ct.py: OK')
PY
