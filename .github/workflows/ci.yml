name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: syntax check
        run: python -m py_compile src/fetch_ct.py src/parse_ct.py src/test_fetch_ct.py
      - name: unit tests (no network)
        run: python src/test_fetch_ct.py
